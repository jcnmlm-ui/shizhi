<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>時值 · 後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F2E9; --surface:#FFFDF8; --surface-2:#FBF7EE;
    --ink:#1B2620; --muted:#6E7A71; --faint:#9AA39B;
    --line:#E5DECE; --line-2:#D8CFBA;
    --primary:#1E6B50; --primary-2:#16523D; --primary-soft:#E4EFE9;
    --accent:#C0863A; --accent-soft:#F4E7D2;
    --danger:#B14430; --danger-soft:#F3E0DA;
    --warn:#C0863A; --warn-soft:#F4E7D2;
    --radius:12px; --shadow:0 2px 16px -6px rgba(27,38,32,.18);
    --font:'Noto Sans TC',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}

  /* ── 登入畫面 ── */
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .login-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px;width:100%;max-width:420px}
  .login-card h1{font-size:22px;margin-bottom:6px}
  .login-card .sub{color:var(--muted);font-size:13px;margin-bottom:28px}
  .login-card .warn-box{background:var(--warn-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--warn);margin-bottom:20px}

  /* ── 主畫面佈局 ── */
  #main-screen{display:none;height:100vh;overflow:hidden}
  .layout{display:flex;height:100%}

  /* ── 側邊欄 ── */
  .sidebar{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .sidebar-head{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sidebar-head .logo{font-weight:700;font-size:15px}
  .sidebar-head .badge{font-size:10px;background:var(--danger-soft);color:var(--danger);padding:2px 8px;border-radius:99px;font-weight:700}
  .stats-row{padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .stat-chip{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
  .stat-chip.sub{background:#e0f0e8;color:var(--primary)}
  .stat-chip.full{background:var(--accent-soft);color:var(--accent)}
  .stat-chip.trial{background:#e8e8f8;color:#5a5a9a}
  .stat-chip.free{background:var(--line);color:var(--muted)}
  .search-wrap{padding:10px 12px;border-bottom:1px solid var(--line)}
  .search-wrap input{width:100%;padding:7px 11px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--ink)}
  .user-list{flex:1;overflow-y:auto;padding:6px}
  .user-item{padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.1s}
  .user-item:hover{background:var(--bg)}
  .user-item.active{background:var(--primary-soft)}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .user-info{overflow:hidden;flex:1}
  .user-email{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-meta{font-size:11px;color:var(--muted);margin-top:1px}
  .plan-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
  .plan-badge.subscription{background:#e0f0e8;color:var(--primary)}
  .plan-badge.full{background:var(--accent-soft);color:var(--accent)}
  .plan-badge.trial{background:#e8e8f8;color:#5a5a9a}
  .plan-badge.free{background:var(--line);color:var(--muted)}
  .plan-badge.local{background:var(--line);color:var(--muted)}

  /* ── 詳細面板 ── */
  .detail{flex:1;overflow-y:auto;background:var(--bg);padding:24px 28px}
  .detail-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:15px;flex-direction:column;gap:10px}
  .detail-placeholder .icon{font-size:40px}

  /* ── 詳細面板內容 ── */
  .user-header{background:var(--surface);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow)}
  .user-header h2{font-size:18px;margin-bottom:6px;word-break:break-all}
  .user-header .meta-grid{display:grid;grid-template-columns:repeat(4,auto);gap:6px 20px;margin-top:10px}
  .user-header .meta-item{font-size:12px;color:var(--muted)}
  .user-header .meta-item b{color:var(--ink);font-weight:600}
  .section-card{background:var(--surface);border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
  .section-card h3{font-size:15px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .current-info{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .status-badge{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
  .status-badge.active{background:#e0f0e8;color:var(--primary)}
  .status-badge.trial{background:#e8e8f8;color:#5a5a9a}
  .status-badge.expired{background:var(--danger-soft);color:var(--danger)}
  .status-badge.cancelled{background:var(--line);color:var(--muted)}
  .form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .form-row.wide{grid-template-columns:1fr 1fr}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted);font-weight:500}
  .field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--ink)}
  .field select{cursor:pointer}
  .addon-row,.override-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--bg);margin-bottom:6px;flex-wrap:wrap}
  .addon-row .name{font-weight:600;font-size:13px;flex:1}
  .override-row .key{font-weight:600;font-size:13px;font-family:monospace;background:var(--line);padding:2px 7px;border-radius:5px}
  .override-row .note{color:var(--muted);font-size:12px;flex:1}
  .override-row .exp{font-size:11px;color:var(--muted)}
  .enabled-chip{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}
  .enabled-chip.on{background:#e0f0e8;color:var(--primary)}
  .enabled-chip.off{background:var(--danger-soft);color:var(--danger)}
  .sep{height:1px;background:var(--line);margin:14px 0}

  /* ── 按鈕 ── */
  .btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500;font-family:var(--font);transition:.12s}
  .btn:hover{border-color:var(--primary);color:var(--primary-2)}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn.primary:hover{background:var(--primary-2)}
  .btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .btn.danger:hover{background:var(--danger);color:#fff}
  .btn.sm{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}

  /* ── 通知列 ── */
  #toast{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast-item{padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:var(--shadow);pointer-events:auto;animation:slideIn .2s ease}
  .toast-item.ok{background:#e0f0e8;color:var(--primary)}
  .toast-item.err{background:var(--danger-soft);color:var(--danger)}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .divider-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
  .copy-id{font-size:10px;font-family:monospace;color:var(--muted);cursor:pointer;background:var(--line);padding:1px 6px;border-radius:4px;user-select:all}
  .copy-id:hover{background:var(--line-2)}
</style>
</head>
<body>

<div id="toast"></div>

<!-- ── 登入畫面 ── -->
<div id="login-screen">
  <div class="login-card">
    <h1>🔐 時值後台管理</h1>
    <p class="sub">用戶訂閱、加購模組、功能覆寫的管理介面</p>
    <div class="warn-box">⚠️ Service Role Key 擁有資料庫完整寫入權限。此頁面僅供本機使用，請勿部署到公開網路。Key 僅存在記憶體中，關閉分頁即清除。</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">
      <div class="field">
        <label>Supabase Project URL</label>
        <input id="adm-url" type="url" placeholder="https://xxx.supabase.co" value="https://haxfwofjrfkjwestfzvk.supabase.co">
      </div>
      <div class="field">
        <label>Service Role Key（Settings → API → service_role）</label>
        <input id="adm-key" type="password" placeholder="eyJhbGciOiJIUzI1NiI...">
      </div>
    </div>
    <button class="btn primary" id="login-btn" style="width:100%;padding:10px">登入後台</button>
    <p style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center">Key 來源：Supabase Dashboard → Project Settings → API → service_role（secret）</p>
  </div>
</div>

<!-- ── 主畫面 ── -->
<div id="main-screen">
  <div class="layout">
    <!-- 側邊欄 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="logo">時值 後台</span>
        <span class="badge">ADMIN</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn sm" onclick="showSiteConfig()" title="網站設定">⚙️</button>
          <button class="btn sm" id="logout-btn">登出</button>
        </div>
      </div>
      <div class="stats-row" id="stats-row"></div>
      <div class="search-wrap">
        <input id="search-input" placeholder="搜尋 Email…" autocomplete="off">
      </div>
      <div class="user-list" id="user-list"></div>
    </aside>

    <!-- 詳細面板 -->
    <section class="detail" id="detail-panel">
      <div class="detail-placeholder">
        <div class="icon">👈</div>
        <div>點選左側用戶查看詳情</div>
      </div>
    </section>
  </div>
</div>

<script>
'use strict';

// ── 全域狀態 ──────────────────────────────────────────────────
let ADMIN_URL = '';
let ADMIN_KEY = '';
let allUsers = [];
let subMap = {};
let plansArr = [];
let addonsArr = [];
let payRequestsArr = [];
let siteConfigArr = [];    // fp_site_config 快取
let selectedUserId = null;

// ── API helpers ───────────────────────────────────────────────
function hdrs(extra = {}) {
  return {
    'apikey': ADMIN_KEY,
    'Authorization': `Bearer ${ADMIN_KEY}`,
    'Content-Type': 'application/json',
    ...extra
  };
}

async function restGet(path) {
  const r = await fetch(`${ADMIN_URL}/rest/v1/${path}`, { headers: hdrs() });
  if (!r.ok) throw new Error(`GET ${path} → ${r.status}: ${await r.text()}`);
  return r.json();
}

async function authGet(path) {
  const r = await fetch(`${ADMIN_URL}/auth/v1/${path}`, { headers: hdrs() });
  if (!r.ok) throw new Error(`AUTH ${path} → ${r.status}: ${await r.text()}`);
  return r.json();
}

async function restPost(path, body, prefer = '') {
  const extra = prefer ? { 'Prefer': prefer } : {};
  const r = await fetch(`${ADMIN_URL}/rest/v1/${path}`, {
    method: 'POST', headers: hdrs(extra), body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`POST ${path} → ${r.status}: ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}

async function restPatch(path, body) {
  const r = await fetch(`${ADMIN_URL}/rest/v1/${path}`, {
    method: 'PATCH',
    headers: hdrs({ 'Prefer': 'return=representation' }),
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`PATCH ${path} → ${r.status}: ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}

async function restDelete(path) {
  const r = await fetch(`${ADMIN_URL}/rest/v1/${path}`, {
    method: 'DELETE', headers: hdrs()
  });
  if (!r.ok) throw new Error(`DELETE ${path} → ${r.status}: ${await r.text()}`);
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── 日期格式化 ────────────────────────────────────────────────
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.getFullYear() + '/' +
    String(d.getMonth() + 1).padStart(2, '0') + '/' +
    String(d.getDate()).padStart(2, '0');
}
function fmtDatetime(s) {
  if (!s) return '—';
  const d = new Date(s);
  return fmtDate(s) + ' ' + String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0');
}
function isoDate(s) {
  if (!s) return '';
  return new Date(s).toISOString().split('T')[0];
}

// ── 登入 ─────────────────────────────────────────────────────
document.getElementById('login-btn').onclick = async () => {
  const url = document.getElementById('adm-url').value.trim().replace(/\/$/, '');
  const key = document.getElementById('adm-key').value.trim();
  if (!url || !key) { toast('請填入 URL 與 Key', 'err'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '驗證中…';
  try {
    ADMIN_URL = url; ADMIN_KEY = key;
    // 測試連線：讀取 plans
    await restGet('fp_plans?select=id&limit=1');
    await loadAll();
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
  } catch (e) {
    toast('連線失敗：' + e.message, 'err');
    ADMIN_URL = ''; ADMIN_KEY = '';
  } finally { btn.disabled = false; btn.textContent = '登入後台'; }
};

document.getElementById('adm-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').onclick = () => {
  ADMIN_URL = ''; ADMIN_KEY = ''; allUsers = []; subMap = {}; selectedUserId = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('adm-key').value = '';
};

// ── 讀取所有基礎資料 ─────────────────────────────────────────
async function loadAll() {
  const [usersResp, subs, plans, addons, payReqs, cfgRows] = await Promise.all([
    authGet('admin/users?per_page=200&page=1'),
    restGet('fp_subscriptions?select=*,fp_plans(id,name)'),
    restGet('fp_plans?select=*&active=eq.true&order=price_monthly.asc'),
    restGet('fp_addons?select=*&active=eq.true&order=created_at.asc'),
    restGet('fp_payment_requests?select=*&order=submitted_at.desc&limit=200'),
    restGet('fp_site_config?select=*&order=key.asc'),
  ]);
  allUsers = usersResp.users || [];
  plansArr = Array.isArray(plans) ? plans : [];
  addonsArr = Array.isArray(addons) ? addons : [];
  payRequestsArr = Array.isArray(payReqs) ? payReqs : [];
  siteConfigArr = Array.isArray(cfgRows) ? cfgRows : [];
  subMap = {};
  if (Array.isArray(subs)) subs.forEach(s => subMap[s.user_id] = s);
  renderStats();
  renderUserList();
}

// ── 統計列 ────────────────────────────────────────────────────
function renderStats() {
  const counts = { subscription: 0, full: 0, trial: 0, free: 0 };
  allUsers.forEach(u => {
    const s = subMap[u.id];
    const plan = s?.plan_id || 'free';
    const st = s?.status || 'active';
    if (st === 'trial') counts.trial++;
    else if (plan === 'subscription') counts.subscription++;
    else if (plan === 'full') counts.full++;
    else counts.free++;
  });
  const pending = payRequestsArr.filter(r => r.status === 'pending').length;
  const r = document.getElementById('stats-row');
  r.innerHTML =
    `<span class="stat-chip" style="background:var(--line);color:var(--muted)">共 ${allUsers.length} 位</span>` +
    `<span class="stat-chip sub">訂閱 ${counts.subscription}</span>` +
    `<span class="stat-chip full">完整 ${counts.full}</span>` +
    `<span class="stat-chip trial">試用 ${counts.trial}</span>` +
    `<span class="stat-chip free">免費 ${counts.free}</span>` +
    (pending > 0 ? `<span class="stat-chip" style="background:var(--warn-soft);color:var(--warn);cursor:pointer" onclick="showPaymentRequests()">待審 ${pending} 筆 ⚠️</span>` : '');
}

// ── 用戶清單 ──────────────────────────────────────────────────
function planClass(planId, status) {
  if (status === 'trial') return 'trial';
  if (planId === 'subscription') return 'subscription';
  if (planId === 'full') return 'full';
  return 'free';
}
function planLabel(planId, status) {
  if (status === 'trial') return '試用中';
  const labels = { subscription: '訂閱制', full: '完整版', free: '試用版' };
  return labels[planId] || planId;
}

function renderUserList(filter = '') {
  const ul = document.getElementById('user-list');
  const filtered = filter
    ? allUsers.filter(u => u.email?.toLowerCase().includes(filter.toLowerCase()))
    : allUsers;
  if (!filtered.length) { ul.innerHTML = '<div class="empty" style="padding:12px 14px">沒有符合的用戶</div>'; return; }
  ul.innerHTML = filtered.map(u => {
    const sub = subMap[u.id];
    const pc = planClass(sub?.plan_id, sub?.status);
    const pl = planLabel(sub?.plan_id, sub?.status);
    const first = (u.email || '?')[0].toUpperCase();
    return `<div class="user-item ${u.id === selectedUserId ? 'active' : ''}" data-id="${u.id}">
      <div class="user-avatar">${first}</div>
      <div class="user-info">
        <div class="user-email">${u.email || '(無 email)'}</div>
        <div class="user-meta">加入 ${fmtDate(u.created_at)}</div>
      </div>
      <span class="plan-badge ${pc}">${pl}</span>
    </div>`;
  }).join('');
  ul.querySelectorAll('.user-item').forEach(el => {
    el.onclick = () => selectUser(el.dataset.id);
  });
}

document.getElementById('search-input').oninput = e => renderUserList(e.target.value);

// ── 選擇用戶 ─────────────────────────────────────────────────
async function selectUser(userId) {
  selectedUserId = userId;
  renderUserList(document.getElementById('search-input').value);
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '<div style="padding:40px;color:var(--muted)">載入中…</div>';

  const user = allUsers.find(u => u.id === userId);
  if (!user) return;

  const [userAddons, overrides, snaps] = await Promise.all([
    restGet(`fp_user_addons?select=*,fp_addons(id,module_key,name)&user_id=eq.${userId}`),
    restGet(`fp_user_overrides?user_id=eq.${userId}&order=created_at.desc`),
    restGet(`fp_snapshots?user_id=eq.${userId}&select=id`),
  ]);

  renderDetail(user, userAddons || [], overrides || [], (snaps || []).length);
}

// ── 詳細面板 ─────────────────────────────────────────────────
function renderDetail(user, userAddons, overrides, snapCount) {
  const sub = subMap[user.id];
  const pc = planClass(sub?.plan_id, sub?.status);
  const panel = document.getElementById('detail-panel');

  // ── 1. 用戶 Header ──────────────────────────────────────────
  let html = `
  <div class="user-header">
    <h2>${user.email}</h2>
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
      <span class="plan-badge ${pc}" style="font-size:12px;padding:3px 10px">${planLabel(sub?.plan_id, sub?.status)}</span>
      ${sub ? `<span class="status-badge ${sub.status}">${sub.status}</span>` : ''}
    </div>
    <div class="meta-grid" style="margin-top:12px;display:flex;gap:20px;flex-wrap:wrap">
      <div class="meta-item">加入時間 <b>${fmtDatetime(user.created_at)}</b></div>
      <div class="meta-item">上次登入 <b>${fmtDatetime(user.last_sign_in_at)}</b></div>
      <div class="meta-item">歷史快照 <b>${snapCount} 份</b></div>
      <div class="meta-item">用戶 ID <span class="copy-id" title="點擊複製" onclick="navigator.clipboard.writeText('${user.id}');toast('已複製 ID')">${user.id.slice(0, 8)}…</span></div>
    </div>
  </div>`;

  // ── 2. 訂閱管理 ─────────────────────────────────────────────
  const planOpts = plansArr.map(p =>
    `<option value="${p.id}" ${sub?.plan_id === p.id ? 'selected' : ''}>${p.name}</option>`
  ).join('');
  const statusOpts = ['active', 'trial', 'expired', 'cancelled'].map(s =>
    `<option value="${s}" ${sub?.status === s ? 'selected' : ''}>${s}</option>`
  ).join('');

  html += `
  <div class="section-card">
    <h3>📋 訂閱方案</h3>
    <div class="form-row">
      <div class="field">
        <label>方案</label>

// ── 訂閱操作 ─────────────────────────────────────────────────
async function saveSubscription(userId) {
  const plan = document.getElementById('sub-plan').value;
  const status = document.getElementById('sub-status').value;
  const trialEnd = document.getElementById('sub-trial-end').value;
  const periodEnd = document.getElementById('sub-period-end').value;
  const note = document.getElementById('sub-note').value;
  const body = {
    user_id: userId,
    plan_id: plan,
    status,
    trial_ends_at: trialEnd || null,
    current_period_end: periodEnd || null,
    note: note || null,
  };
  try {
    await restPost('fp_subscriptions', body, 'resolution=merge-duplicates,return=representation');
    // 更新本地快取
    const subs = await restGet('fp_subscriptions?select=*,fp_plans(id,name)');
    subMap = {};
    if (Array.isArray(subs)) subs.forEach(s => subMap[s.user_id] = s);
    renderStats();
    renderUserList(document.getElementById('search-input').value);
    await selectUser(userId);
    toast('✅ 訂閱已更新');
  } catch (e) { toast('❌ 更新失敗：' + e.message, 'err'); }
}

async function deleteSubscription(userId) {
  if (!confirm('確定刪除此用戶的訂閱紀錄嗎？刪除後方案會回到預設免費版。')) return;
  try {
    await restDelete(`fp_subscriptions?user_id=eq.${userId}`);
    delete subMap[userId];
    renderStats();
    renderUserList(document.getElementById('search-input').value);
    await selectUser(userId);
    toast('✅ 訂閱紀錄已刪除');
  } catch (e) { toast('❌ 刪除失敗：' + e.message, 'err'); }
}

// ── 加購模組操作 ──────────────────────────────────────────────
async function grantAddon(userId) {
  const addonId = document.getElementById('grant-addon').value;
  const exp = document.getElementById('grant-exp').value;
  if (!addonId) { toast('請選擇模組', 'err'); return; }
  const body = { user_id: userId, addon_id: addonId };
  if (exp) body.expires_at = exp;
  try {
    await restPost('fp_user_addons', body, 'resolution=ignore-duplicates');
    await selectUser(userId);
    toast('✅ 模組已授予');
  } catch (e) { toast('❌ 授予失敗：' + e.message, 'err'); }
}

async function revokeAddon(userAddonId, userId) {
  if (!confirm('確定撤銷這個模組？')) return;
  try {
    await restDelete(`fp_user_addons?id=eq.${userAddonId}`);
    await selectUser(userId);
    toast('✅ 模組已撤銷');
  } catch (e) { toast('❌ 撤銷失敗：' + e.message, 'err'); }
}

// ── 功能覆寫操作 ──────────────────────────────────────────────
async function addOverride(userId) {
  const key = document.getElementById('ov-key').value.trim();
  const enabled = document.getElementById('ov-enabled').value === 'true';
  const exp = document.getElementById('ov-exp').value;
  const note = document.getElementById('ov-note').value;
  if (!key) { toast('請輸入功能 Key', 'err'); return; }
  const body = { user_id: userId, feature_key: key, enabled };
  if (exp) body.expires_at = exp;
  if (note) body.note = note;
  try {
    await restPost('fp_user_overrides', body, 'return=representation');
    await selectUser(userId);
    toast('✅ 覆寫已新增');
  } catch (e) { toast('❌ 新增失敗：' + e.message, 'err'); }
}

async function deleteOverride(overrideId, userId) {
  try {
    await restDelete(`fp_user_overrides?id=eq.${overrideId}`);
    await selectUser(userId);
    toast('✅ 覆寫已刪除');
  } catch (e) { toast('❌ 刪除失敗：' + e.message, 'err'); }
}

async function approvePayRequest(reqId, userId, planId) {
  if (!userId) { toast('找不到對應的用戶 ID，請手動操作', 'err'); return; }
  const r = payRequestsArr.find(x => x.id === reqId);
  const isAddon = r?.plan_requested === 'addon' && r?.addon_key;
  const actionLabel = isAddon ? `加購模組「${r.addon_key}」` : `升級到${planId==='full'?'完整版':'訂閱制'}`;
  if (!confirm(`確定批准此申請並開通「${actionLabel}」？`)) return;
  try {
    // 1) 更新申請狀態
    await restPatch(`fp_payment_requests?id=eq.${reqId}`, {
      status: 'verified', processed_at: new Date().toISOString(), admin_note: '末五碼核對通過'
    });

    if (isAddon) {
      // 2a) 加購模組 → 找到 addon_id 後寫入 fp_user_addons
      const addons = await restGet(`fp_addons?module_key=eq.${r.addon_key}&select=id,name`);
      if (!addons?.length) { toast('找不到模組 ' + r.addon_key, 'err'); return; }
      await restPost('fp_user_addons', {
        user_id: userId, addon_id: addons[0].id, note: '匯款驗證加購'
      }, 'resolution=ignore-duplicates');
      toast('✅ 加購模組已開通：' + addons[0].name);
    } else {
      // 2b) 方案升級 → 寫入 fp_subscriptions
      const months = r?.duration_months || 1;
      const periodEnd = planId === 'subscription'
        ? new Date(Date.now() + months * 30.5 * 86400000).toISOString()
        : null;
      await restPost('fp_subscriptions', {
        user_id: userId, plan_id: planId, status: 'active',
        current_period_end: periodEnd,
        note: '匯款驗證開通' + (planId==='subscription' ? ` (${months}個月)` : '')
      }, 'resolution=merge-duplicates,return=representation');
      toast('✅ 方案已開通：' + (planId==='full'?'完整版':'訂閱制'));
    }

    // 重新載入
    payRequestsArr = await restGet('fp_payment_requests?select=*&order=submitted_at.desc&limit=200');
    const subs = await restGet('fp_subscriptions?select=*,fp_plans(id,name)');
    subMap = {}; if (Array.isArray(subs)) subs.forEach(s => subMap[s.user_id] = s);
    renderStats();
    showPaymentRequests();
  } catch (e) { toast('❌ 操作失敗：' + e.message, 'err'); }
}

async function rejectPayRequest(reqId) {
  const reason = prompt('拒絕原因（選填）：') ?? '';
  try {
    await restPatch(`fp_payment_requests?id=eq.${reqId}`, {
      status: 'rejected', processed_at: new Date().toISOString(),
      admin_note: reason || '未符合驗證條件'
    });
    toast('已標記為拒絕');
    payRequestsArr = await restGet('fp_payment_requests?select=*&order=submitted_at.desc&limit=200');
    renderStats();
    showPaymentRequests();
  } catch (e) { toast('❌ 操作失敗：' + e.message, 'err'); }
}
</script>
</body>
</html>
