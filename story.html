<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="page-title">故事與案例 · 時值</title>
<meta id="page-desc" name="description" content="時值財務地圖的產品故事與個人理財服務案例分享，分享我們如何幫助用戶規劃財務未來。" />
<meta property="og:site_name" content="時值 · 財務地圖" />
<meta id="og-type" property="og:type" content="website" />
<meta id="og-title" property="og:title" content="故事與案例 · 時值" />
<meta id="og-desc" property="og:description" content="時值財務地圖的產品故事與個人理財服務案例分享，分享我們如何幫助用戶規劃財務未來。" />
<meta id="og-url" property="og:url" content="https://valuelens.tw/story.html" />
<link id="canonical" rel="canonical" href="https://valuelens.tw/story.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
<style>
:root{
  --bg:#F6F2E9;--surface:#FFFDF8;--ink:#1B2620;--muted:#6E7A71;--faint:#9AA39B;
  --line:#E5DECE;--line-2:#D8CFBA;--primary:#1E6B50;--primary-2:#16523D;--primary-soft:#E4EFE9;
  --accent:#C0863A;--accent-soft:#F4E7D2;
  --font-display:'Fraunces','Georgia',serif;
  --font-body:'Noto Sans TC',system-ui,sans-serif;
  --radius:14px;
  --shadow:0 1px 3px rgba(27,38,32,.06),0 8px 24px -12px rgba(27,38,32,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.7}
a{color:var(--primary)}

nav{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:60px;background:rgba(246,242,233,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-brand{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--primary-2);text-decoration:none}
.nav-tool{font-size:13.5px;color:var(--primary);text-decoration:none;font-weight:500}
.nav-tool:hover{text-decoration:underline}

.wrap{max-width:820px;margin:0 auto;padding:48px 40px 100px}

.page-header{margin-bottom:32px}
.page-header h1{font-family:var(--font-display);font-weight:500;font-size:34px;margin:0 0 6px;letter-spacing:.3px}
.page-header p{color:var(--muted);font-size:14px}

.filter-bar{display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.filter-btn{
  border:1.5px solid var(--line-2);background:var(--surface);color:var(--muted);
  padding:7px 18px;border-radius:99px;font-size:13.5px;font-weight:500;
  cursor:pointer;font-family:var(--font-body);transition:.15s;
}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.post-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;
  text-decoration:none;display:block;color:inherit;
}
.post-card:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(27,38,32,.08),0 16px 40px -16px rgba(27,38,32,.26);border-color:var(--line-2)}
.card-emoji{width:48px;height:48px;background:var(--primary-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.card-cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:10px}
.card-cat.story{background:var(--primary-soft);color:var(--primary-2)}
.card-cat.case_study{background:var(--accent-soft);color:var(--accent)}
.card-cat.finance_knowledge{background:#e8f4fd;color:#1a6fa8}
.card-cat.finance_concept{background:#f3e8ff;color:#6d28d9}
.card-cat.creator_note{background:#fff0f6;color:#be185d}
.card-title{font-family:var(--font-display);font-size:19px;font-weight:500;line-height:1.35;margin-bottom:8px;color:var(--ink)}
.card-excerpt{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

#detail{display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);border:0;background:0;cursor:pointer;font-family:var(--font-body);padding:0;margin-bottom:32px;text-decoration:none}
.back-btn:hover{color:var(--primary)}
.article-emoji{font-size:48px;text-align:center;margin-bottom:20px}
.article-cat{text-align:center;margin-bottom:12px}
.article-title{font-family:var(--font-display);font-size:34px;font-weight:500;line-height:1.2;margin-bottom:16px;text-align:center}
.article-meta{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:44px;flex-wrap:wrap}
.article-body{font-size:15.5px;line-height:1.85;color:var(--ink)}
.article-body h1,.article-body h2,.article-body h3{font-family:var(--font-display);font-weight:500;margin:36px 0 14px;line-height:1.3}
.article-body h1{font-size:27px}
.article-body h2{font-size:22px}
.article-body h3{font-size:18px}
.article-body p{margin-bottom:18px}
.article-body ul,.article-body ol{margin:0 0 18px 22px}
.article-body li{margin-bottom:6px}
.article-body blockquote{border-left:3px solid var(--primary);padding:12px 18px;margin:20px 0;background:var(--primary-soft);border-radius:0 8px 8px 0;font-style:italic;color:var(--primary-2)}
.article-body code{background:var(--line);padding:2px 6px;border-radius:4px;font-size:13px;font-family:monospace}
.article-body pre{background:#1B2620;color:#e8f4ee;padding:16px 20px;border-radius:10px;overflow-x:auto;margin:20px 0}
.article-body pre code{background:none;padding:0;color:inherit;font-size:13px}
.article-body hr{border:none;border-top:1px solid var(--line);margin:36px 0}
.article-body img{max-width:100%;border-radius:10px;margin:16px 0}
/* Editor.js 圖片區塊 */
.article-img{margin:20px 0}
.article-img img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.article-img figcaption,figure figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
figure{margin:20px 0;text-align:center}
figure img{border-radius:8px;display:block;margin:0 auto;max-width:100%}
.img-stretched img{width:100%}
.img-background{background:var(--surface-2);padding:16px;border-radius:12px}
.img-border img{border:1px solid var(--line-2)}
/* YouTube / embed */
.embed-wrap{margin:20px 0}
.embed-wrap iframe{width:100%;aspect-ratio:16/9;border-radius:10px;border:0}
.article-body table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:14px}
.article-body th{background:var(--primary-soft);color:var(--primary-2);padding:9px 12px;text-align:left;font-weight:700}
.article-body td{padding:9px 12px;border-bottom:1px solid var(--line)}
.disclaimer{background:var(--accent-soft);border:1px solid #e0bb8a;border-radius:10px;padding:14px 18px;margin-top:44px;font-size:13px;color:#7a5018;line-height:1.65}
.article-footer{margin-top:32px;padding-top:28px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;align-items:center}

.loading{text-align:center;padding:64px 20px;color:var(--muted);font-size:15px}
.empty-state{text-align:center;padding:64px 20px}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{color:var(--muted);margin-top:6px}

footer{text-align:center;padding:28px 20px;font-size:13px;color:var(--faint);border-top:1px solid var(--line)}
footer a{color:var(--primary);margin:0 6px}

@media(max-width:600px){
  nav{padding:0 16px}
  .wrap{padding:28px 16px 80px}
  .article-title{font-size:26px}
  .card-grid{grid-template-columns:1fr}
  .filter-bar{gap:6px}
  .filter-btn{padding:6px 13px;font-size:13px}
}
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">時值</a>
  <a class="nav-tool" href="app.html">前往工具 →</a>
</nav>

<div class="wrap">
  <!-- ── 列表視圖 ── -->
  <div id="list">
    <div class="page-header">
      <h1>故事與案例</h1>
      <p>產品誕生的心路歷程，以及個人理財服務的真實案例分享</p>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="story" onclick="setFilter('story')">產品故事</button>
      <button class="filter-btn" data-filter="finance_knowledge" onclick="setFilter('finance_knowledge')">理財知識</button>
      <button class="filter-btn" data-filter="finance_concept" onclick="setFilter('finance_concept')">理財觀念</button>
      <button class="filter-btn" data-filter="creator_note" onclick="setFilter('creator_note')">創作者心得</button>
    </div>
    <div id="post-grid"><div class="loading">載入文章中…</div></div>
  </div>

  <!-- ── 文章詳細視圖 ── -->
  <div id="detail">
    <button class="back-btn" onclick="goBack()">← 返回列表</button>
    <div id="article-content"></div>
  </div>
</div>

<footer>
  <a href="about.html">關於我們</a>
  <a href="terms.html">使用者條款與隱私政策</a>
  <a href="index.html">時值 · 財務地圖</a>
</footer>

<script>
'use strict';

const SUPABASE_URL = 'https://haxfwofjrfkjwestfzvk.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhheGZ3b2ZqcmZrandlc3RmenZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTg2NzQsImV4cCI6MjA5NjIzNDY3NH0.j-mo1J0D-xDmsLb1sTBjthKHXMJVu1Y_bj5akCKE07w';
const SITE_BASE = 'https://valuelens.tw/';

const CAT_LABELS = { story: '產品故事', case_study: '服務案例分享', finance_knowledge: '理財知識', finance_concept: '理財觀念', creator_note: '創作者心得' };

let posts = [];
let currentFilter = 'all';

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBlock(block) {
  const d = block.data || {};
  switch (block.type) {
    case 'header':
      return `<h${d.level}>${d.text}</h${d.level}>`;
    case 'paragraph':
      return d.text ? `<p>${d.text}</p>` : '';
    case 'image': {
      const cls = ['article-img', d.stretched ? 'img-stretched' : '', d.withBackground ? 'img-background' : '', d.withBorder ? 'img-border' : ''].filter(Boolean).join(' ');
      return `<figure class="${cls}"><img src="${escHtml(d.file?.url||'')}" alt="${escHtml(d.caption||'')}">
        ${d.caption ? `<figcaption>${d.caption}</figcaption>` : ''}</figure>`;
    }
    case 'list': {
      const tag = d.style === 'ordered' ? 'ol' : 'ul';
      const items = (d.items||[]).map(i => `<li>${typeof i === 'string' ? i : (i.content||'')}</li>`).join('');
      return `<${tag}>${items}</${tag}>`;
    }
    case 'quote':
      return `<blockquote>${d.text}${d.caption ? `<cite>— ${d.caption}</cite>` : ''}</blockquote>`;
    case 'delimiter':
      return '<hr>';
    case 'code':
      return `<pre><code>${escHtml(d.code||'')}</code></pre>`;
    case 'embed':
      return `<div class="embed-wrap"><iframe src="${escHtml(d.embed||'')}" allowfullscreen></iframe></div>`;
    case 'table': {
      const rows = (d.content||[]).map((row, i) => {
        const tag = i === 0 && d.withHeadings ? 'th' : 'td';
        return `<tr>${row.map(c=>`<${tag}>${c}</${tag}>`).join('')}</tr>`;
      }).join('');
      return `<table>${rows}</table>`;
    }
    default: return '';
  }
}

function renderContent(content) {
  if (!content) return '';
  // Editor.js JSON（舊格式）
  try {
    const data = JSON.parse(content);
    if (data.blocks && Array.isArray(data.blocks)) return data.blocks.map(renderBlock).join('');
  } catch {}
  // TipTap HTML（新格式）
  if (content.trim().startsWith('<')) return content;
  // 舊 Markdown fallback
  return marked.parse(content);
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
}

async function loadPosts() {
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/fp_posts?select=*&published=eq.true&order=published_at.desc`,
    { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } }
  );
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

function cardHtml(p) {
  const catCls = ['case_study','finance_knowledge','finance_concept','creator_note'].includes(p.category) ? p.category : 'story';
  const catLabel = CAT_LABELS[p.category] || p.category;
  return `
    <a class="post-card" href="?post=${esc(p.slug)}" onclick="openPost(event,'${esc(p.slug)}')">
      <div class="card-emoji">${esc(p.cover_emoji || '📝')}</div>
      <span class="card-cat ${catCls}">${catLabel}</span>
      <div class="card-title">${esc(p.title)}</div>
      ${p.excerpt ? `<div class="card-excerpt">${esc(p.excerpt)}</div>` : ''}
      <div class="card-meta">
        <span>✍️ ${esc(p.author || '鄭家弦')}</span>
        <span>· ${fmtDate(p.published_at || p.created_at)}</span>
      </div>
    </a>`;
}

function renderList() {
  const grid = document.getElementById('post-grid');
  const filtered = currentFilter === 'all' ? posts : posts.filter(p => p.category === currentFilter);
  if (!filtered.length) {
    const label = currentFilter === 'all' ? '' : `「${CAT_LABELS[currentFilter]}」`;
    grid.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>目前沒有${label}的文章</p></div>`;
    return;
  }
  grid.innerHTML = `<div class="card-grid">${filtered.map(cardHtml).join('')}</div>`;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  renderList();
}

function openPost(e, slug) {
  e.preventDefault();
  const post = posts.find(p => p.slug === slug);
  if (!post) return;
  history.pushState({ slug }, '', `?post=${slug}`);
  showDetail(post);
}

function showDetail(post) {
  document.getElementById('list').style.display = 'none';
  document.getElementById('detail').style.display = 'block';

  const pageTitle = `${post.title} · 時值`;
  const desc = post.excerpt || post.title;
  const articleUrl = `${SITE_BASE}posts/${post.slug}/`;

  document.title = pageTitle;
  document.getElementById('page-title').textContent = pageTitle;
  document.getElementById('page-desc').setAttribute('content', desc);
  document.getElementById('og-type').setAttribute('content', 'article');
  document.getElementById('og-title').setAttribute('content', pageTitle);
  document.getElementById('og-desc').setAttribute('content', desc);
  document.getElementById('og-url').setAttribute('content', articleUrl);
  document.getElementById('canonical').setAttribute('href', articleUrl);

  injectJsonLd({
    '@context': 'https://schema.org',
    '@type': 'Article',
    headline: post.title,
    description: post.excerpt || '',
    author: { '@type': 'Person', name: post.author || '鄭家弦' },
    datePublished: post.published_at || post.created_at,
    dateModified: post.updated_at || post.published_at || post.created_at,
    url: articleUrl,
    publisher: {
      '@type': 'Organization',
      name: '時值 · 財務地圖',
      url: SITE_BASE
    }
  });

  const isCaseStudy = post.category === 'case_study';
  const disclaimerText = isCaseStudy
    ? '<b>案例說明：</b>本案例已完整去識別化處理，人名、金額等識別資訊均已修改，並已取得當事人同意分享。所有內容僅供參考，不構成投資建議或個別財務規劃建議。重大財務決策請諮詢具有合法資格的財務或法律專業人士。'
    : '<b>免責聲明：</b>本文內容僅供參考，不構成投資建議或財務規劃建議。重大財務決策請諮詢具有合法資格的財務或法律專業人士。';

  const catCls = ['case_study','finance_knowledge','finance_concept','creator_note'].includes(post.category) ? post.category : 'story';
  const catLabel = CAT_LABELS[post.category] || post.category;
  const htmlBody = renderContent(post.content || '');

  document.getElementById('article-content').innerHTML = `
    <div class="article-emoji">${esc(post.cover_emoji || '📝')}</div>
    <div class="article-cat"><span class="card-cat ${catCls}">${catLabel}</span></div>
    <h1 class="article-title">${esc(post.title)}</h1>
    <div class="article-meta">
      <span>✍️ ${esc(post.author || '鄭家弦')}</span>
      <span>·</span>
      <span>${fmtDate(post.published_at || post.created_at)}</span>
    </div>
    <div class="article-body">${htmlBody}</div>
    <div class="disclaimer">${disclaimerText}</div>
    <div class="article-footer">
      <a href="story.html" style="color:var(--muted);font-size:13.5px;text-decoration:none">← 返回故事與案例</a>
      <a href="app.html" style="color:var(--primary);font-size:13.5px;text-decoration:none;margin-left:auto">前往時值工具 →</a>
    </div>`;

  window.scrollTo({ top: 0 });
}

function goBack() {
  history.pushState(null, '', 'story.html');
  showList();
}

function showList() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  document.title = '故事與案例 · 時值';
  document.getElementById('og-type').setAttribute('content', 'website');
  document.getElementById('og-title').setAttribute('content', '故事與案例 · 時值');
  document.getElementById('og-url').setAttribute('content', `${SITE_BASE}story.html`);
  document.getElementById('canonical').setAttribute('href', `${SITE_BASE}story.html`);
  removeJsonLd();
}

function injectJsonLd(schema) {
  removeJsonLd();
  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.id = 'ld-article';
  s.textContent = JSON.stringify(schema);
  document.head.appendChild(s);
}
function removeJsonLd() { document.getElementById('ld-article')?.remove(); }

window.addEventListener('popstate', () => {
  const slug = new URLSearchParams(location.search).get('post');
  if (slug) {
    const post = posts.find(p => p.slug === slug);
    if (post) { showDetail(post); return; }
  }
  showList();
});

async function init() {
  try {
    posts = await loadPosts();
  } catch (e) {
    document.getElementById('post-grid').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><p>載入失敗，請稍後再試（${esc(e.message)}）</p></div>`;
    return;
  }

  const slug = new URLSearchParams(location.search).get('post');
  if (slug) {
    const post = posts.find(p => p.slug === slug);
    if (post) { showDetail(post); return; }
  }
  renderList();
}

init();
</script>
</body>
</html>
